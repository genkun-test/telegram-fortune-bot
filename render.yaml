services:
  - type: worker
    name: telegram-fortune-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_fortune_bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
